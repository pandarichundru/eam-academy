name: Deploy academy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-content.py
      - uses: actions/configure-pages@v5
      - name: Stage static site
        run: |
          mkdir _site
          cp -R data *.html *.css *.js *.json *.svg *.webmanifest *.txt *.sql _site/
          sed -i "s/const version = prefix + '1';/const version = prefix + '$GITHUB_SHA';/" _site/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
