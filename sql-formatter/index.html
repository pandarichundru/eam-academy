<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SQL Formatter — Offline Workbench</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brandmark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="12" height="12" rx="2.5"></rect>
            <path d="M5 6h6M5 8.5h4M5 11h6"></path>
          </svg>
        </span>
        <div>
          <span class="brand-title">SQL Formatter</span>
          <span class="brand-sub">Offline Workbench</span>
        </div>
      </div>

      <div class="toolbar-actions">
        <button id="btnFormat" type="button" class="primary" title="Format SQL (Ctrl/Cmd + Shift + F)">
          <span>Format</span>
          <kbd id="shortcutHint">⌘⇧F</kbd>
        </button>
        <button id="btnMinify" type="button" title="Minify SQL to single line">Minify</button>
        <button id="btnCopy" type="button" title="Copy SQL to clipboard">Copy</button>
        <button id="btnClear" type="button" title="Clear editor">Clear</button>
        <button id="btnTheme" type="button" aria-label="Toggle dark/light theme" title="Toggle theme">Dark mode</button>
      </div>
    </header>

    <section class="options-bar" aria-label="Formatting options">
      <div class="options-group">
        <label class="opt-field">
          <span>Dialect</span>
          <select id="optDialect">
            <option value="standard">Standard SQL</option>
            <option value="postgresql">PostgreSQL</option>
            <option value="mysql">MySQL</option>
            <option value="plsql">Oracle PL/SQL</option>
            <option value="tsql">SQL Server (T-SQL)</option>
            <option value="sqlite">SQLite</option>
          </select>
        </label>

        <label class="opt-field">
          <span>Indent</span>
          <select id="optIndent">
            <option value="2">2 spaces</option>
            <option value="4">4 spaces</option>
            <option value="tab">Tab</option>
          </select>
        </label>

        <label class="opt-field">
          <span>Keywords</span>
          <select id="optCase">
            <option value="upper">UPPERCASE</option>
            <option value="lower">lowercase</option>
            <option value="preserve">Preserve</option>
          </select>
        </label>

        <label class="opt-field">
          <span>Commas</span>
          <select id="optComma">
            <option value="trailing">Trailing (a,)</option>
            <option value="leading">Leading (, a)</option>
          </select>
        </label>
      </div>

      <div class="privacy-badge" role="status">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span>Your SQL never leaves your browser.</span>
      </div>
    </section>

    <div id="statusBar" class="status-bar" aria-live="polite"></div>

    <main class="editor-main">
      <div class="workbench-frame">
        <div id="gutter" class="gutter" aria-hidden="true"><div>1</div></div>
        <div class="editor-stack">
          <pre id="highlight" class="editor-highlight" aria-hidden="true"></pre>
          <textarea
            id="sqlInput"
            class="editor-input"
            spellcheck="false"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            aria-label="SQL query editor"
            placeholder="Paste SQL here and press Format (Ctrl/Cmd + Shift + F)..."
          ></textarea>
        </div>
      </div>
    </main>

    <footer class="statusbar">
      <span id="cursorStats">Line 1, Col 1 · 0 chars</span>
      <span>Client-side only · No storage · No network requests</span>
    </footer>
  </div>

  <script src="sql-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
